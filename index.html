<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuteur Sport</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #94a3b8;
            text-align: center;
        }
        .inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }
        .inputs input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 1.5rem;
            padding: 10px;
            width: 70px;
            text-align: center;
            border-radius: 8px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            max-width: 350px;
            width: 100%;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
        }
        button.btn-main {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            max-width: 350px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.btn-main:active {
            background-color: #1d4ed8;
        }
        #display-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        #phase-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #timer-countdown {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
        }
        #rounds-counter {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div id="setup-screen" style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 350px;">
        <h1>Minuteur Sport</h1>
        
        <div class="card">
            <label>Temps de Course</label>
            <div class="inputs">
                <input type="number" id="work-min" value="0" min="0"> min
                <input type="number" id="work-sec" value="30" min="0" max="59"> sec
            </div>
        </div>

        <div class="card">
            <label>Temps de Pause</label>
            <div class="inputs">
                <input type="number" id="rest-min" value="0" min="0"> min
                <input type="number" id="rest-sec" value="15" min="0" max="59"> sec
            </div>
        </div>

        <div class="card">
            <label>Nombre de Tours</label>
            <div class="inputs">
                <input type="number" id="total-rounds" value="5" min="1" style="width: 100px;">
            </div>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="alert-sound" checked>
            <label for="alert-sound" style="display:inline; margin:0; color:inherit;">Activer l'alerte sonore</label>
        </div>

        <button class="btn-main" onclick="startTimer()">Démarrer la séance</button>
    </div>

    <div id="display-screen">
        <div id="phase-title">COURSE</div>
        <div id="rounds-counter">Tour 1 / 5</div>
        <div id="timer-countdown">00:30</div>
        <button class="btn-main" style="background-color: #ef4444;" onclick="stopTimer()">Arrêter</button>
    </div>

    <script>
        let workTime = 30;
        let restTime = 15;
        let totalRounds = 5;
        
        let currentRound = 1;
        let isWorkPhase = true;
        let timeLeft = 30;
        let timerInterval = null;
        let wakeLock = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(frequency = 440, duration = 150) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (duration / 1000));
            } catch (e) {
                console.log("Audio non supporté ou bloqué");
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function startTimer() {
            initAudio();
            const wMin = parseInt(document.getElementById('work-min').value) || 0;
            const wSec = parseInt(document.getElementById('work-sec').value) || 0;
            workTime = (wMin * 60) + wSec;

            const rMin = parseInt(document.getElementById('rest-min').value) || 0;
            const rSec = parseInt(document.getElementById('rest-sec').value) || 0;
            restTime = (rMin * 60) + rSec;

            totalRounds = parseInt(document.getElementById('total-rounds').value) || 1;

            if (workTime <= 0) {
                alert("Veuillez entrer un temps de course valide.");
                return;
            }

            currentRound = 1;
            isWorkPhase = true;
            timeLeft = workTime;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('display-screen').style.display = 'flex';

            requestWakeLock();
            updateDisplay();

            let lastTimestamp = Date.now();
            timerInterval = setInterval(() => {
                const now = Date.now();
                const delta = Math.floor((now - lastTimestamp) / 1000);
                
                if (delta >= 1) {
                    timeLeft -= delta;
                    lastTimestamp = now;

                    const soundEnabled = document.getElementById('alert-sound').checked;

                    if (timeLeft <= 3 && timeLeft > 0 && soundEnabled) {
                        playBeep(600, 100); // Bip de compte à rebours
                    }

                    if (timeLeft <= 0) {
                        if (soundEnabled) {
                            playBeep(880, 400); // Bip de changement de phase
                        }
                        handlePhaseSwitch();
                    } else {
                        updateDisplay();
                    }
                }
            }, 200);
        }

        function handlePhaseSwitch() {
            if (isWorkPhase) {
                if (restTime > 0) {
                    isWorkPhase = false;
                    timeLeft = restTime;
                } else {
                    if (currentRound >= totalRounds) {
                        endTimer();
                        return;
                    }
                    currentRound++;
                    isWorkPhase = true;
                    timeLeft = workTime;
                }
            } else {
                if (currentRound >= totalRounds) {
                    endTimer();
                    return;
                }
                currentRound++;
                isWorkPhase = true;
                timeLeft = workTime;
            }
            updateDisplay();
        }

        function updateDisplay() {
            const phaseTitle = document.getElementById('phase-title');
            const countdown = document.getElementById('timer-countdown');
            const roundsCounter = document.getElementById('rounds-counter');

            if (isWorkPhase) {
                phaseTitle.textContent = "COURSE";
                phaseTitle.style.color = "#38bdf8";
            } else {
                phaseTitle.textContent = "PAUSE";
                phaseTitle.style.color = "#facc15";
            }

            roundsCounter.textContent = `Tour ${currentRound} / ${totalRounds}`;

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdown.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function stopTimer() {
            clearInterval(timerInterval);
            releaseWakeLock();
            document.getElementById('display-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        function endTimer() {
            clearInterval(timerInterval);
            releaseWakeLock();
            playBeep(1000, 600);
            alert("Séance terminée ! Bravo !");
            stopTimer();
        }
    </script>
</body>
</html>
